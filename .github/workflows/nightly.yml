name: Extended

# The weekly extended run: everything that left the pull-request path. The
# full desktop Chromium suite, the smoke list on iPhone WebKit, the mocked
# /konto DOM suite and the full advisory and licence audits. It never blocks a
# merge. A red test here is fixed or deleted within 7 days.
#
# Run it on demand before a risky release:  gh workflow run nightly.yml --ref main
# No job here may be called `verify`: that name is the release signal in ci.yml.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  browser:
    name: browser chromium ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_SERVER_MODE: production
      E2E_PORT: "3000"
      E2E_GLOBAL_TIMEOUT: 2100000
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright-browsers: chromium
          next-build-cache: "true"
      - run: bun run --cwd packages/website verify:build
      - name: Browser suite
        run: >-
          bun run --cwd packages/website e2e:shard:built test
          --project=chromium
          --shard=${{ matrix.shard }}
          --workers=2
          --retries=1
          --grep-invert "@quarantine|@launch-gate"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failures-chromium-${{ strategy.job-index }}
          path: packages/website/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # WebKit runs the smoke list only: engine bugs show at page level, and the
  # full iPhone/WebKit suite was the main source of timeouts.
  webkit:
    name: browser mobile-webkit smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_SERVER_MODE: production
      E2E_PORT: "3000"
      E2E_GLOBAL_TIMEOUT: 2100000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright-browsers: webkit
          next-build-cache: "true"
      - run: bun run --cwd packages/website verify:build
      - name: WebKit smoke
        run: >-
          bun run --cwd packages/website e2e:shard:built test
          --project=mobile-webkit
          --workers=1
          --retries=2
          $(node scripts/ci.mjs smoke-files)
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failures-mobile-webkit
          path: packages/website/test-results/
          if-no-files-found: ignore
          retention-days: 7

  konto-dom:
    name: konto DOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_SERVER_MODE: production
      E2E_PORT: "3000"
      E2E_GLOBAL_TIMEOUT: 600000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright-browsers: chromium
      # Builds its own public-config-only bundle with fictional Supabase values
      # and serves the endpoints the server calls during SSR from an in-process
      # preload. DOM and token-plumbing coverage, not authentication proof.
      - run: bun run --cwd packages/website test:e2e:konto-dom-mocked

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The full advisory audit (every level) and the licence audit.
      - run: bun run ci:hygiene
