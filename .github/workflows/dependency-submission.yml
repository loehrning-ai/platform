name: Bun Dependency Submission

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: bun-dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified Bun
        run: bash .github/scripts/install-verified-bun.sh
      - name: Validate frozen Bun dependency tree
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify dependency snapshot implementation
        run: bun run test:dependency-snapshot
      - name: Verify dependency submission inputs stayed immutable
        run: >-
          git diff --exit-code --
          bun.lock
          package.json
          packages/*/package.json
          scripts/submit-bun-dependency-snapshot.ts
          .github/scripts/install-verified-bun.sh
          .github/workflows/dependency-submission.yml
      - name: Generate complete Bun dependency snapshot
        run: >-
          bun scripts/submit-bun-dependency-snapshot.ts
          > "${RUNNER_TEMP}/dependency-snapshot.json"
      - name: Upload immutable submission payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-dependency-snapshot
          path: ${{ runner.temp }}/dependency-snapshot.json
          if-no-files-found: error
          retention-days: 1

  submit:
    if: github.ref == 'refs/heads/main'
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download generated snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bun-dependency-snapshot
          path: ${{ runner.temp }}/bun-dependency-snapshot
      - name: Validate and submit dependency snapshot
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { lstat, readFile } from "node:fs/promises";
          import { join } from "node:path";

          const fail = (message) => {
            throw new Error(`Dependency submission rejected: ${message}`);
          };
          const object = (value, label) => {
            if (!value || typeof value !== "object" || Array.isArray(value)) {
              fail(`${label} must be an object`);
            }
            return value;
          };
          const nonEmptyString = (value, label, maximum = 512) => {
            if (
              typeof value !== "string" ||
              value.length === 0 ||
              value.length > maximum ||
              /[\u0000-\u001f\u007f]/.test(value)
            ) {
              fail(`${label} must be a bounded non-control string`);
            }
            return value;
          };

          const artifactPath = join(
            process.env.RUNNER_TEMP ?? "",
            "bun-dependency-snapshot",
            "dependency-snapshot.json",
          );
          const artifactStat = await lstat(artifactPath);
          if (!artifactStat.isFile() || artifactStat.isSymbolicLink()) {
            fail("artifact must be a regular non-symlink file");
          }
          if (artifactStat.size < 1 || artifactStat.size > 16 * 1024 * 1024) {
            fail("artifact size is outside the 1 byte to 16 MiB boundary");
          }

          let snapshot;
          try {
            snapshot = JSON.parse(await readFile(artifactPath, "utf8"));
          } catch {
            fail("artifact must contain valid JSON");
          }
          snapshot = object(snapshot, "snapshot");
          if (snapshot.version !== 0) fail("snapshot.version must equal 0");
          if (
            !/^[0-9a-f]{40}$/i.test(process.env.GITHUB_SHA ?? "") ||
            snapshot.sha !== process.env.GITHUB_SHA
          ) {
            fail("snapshot.sha must equal the current commit SHA");
          }
          if (
            process.env.GITHUB_REF !== "refs/heads/main" ||
            snapshot.ref !== process.env.GITHUB_REF
          ) {
            fail("snapshot.ref must equal refs/heads/main");
          }
          const repository = process.env.GITHUB_REPOSITORY ?? "";
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) {
            fail("GITHUB_REPOSITORY is invalid");
          }
          const runId = process.env.GITHUB_RUN_ID ?? "";
          if (!/^[1-9]\d{0,19}$/.test(runId)) {
            fail("GITHUB_RUN_ID is invalid");
          }
          const expectedJobUrl =
            `https://github.com/${repository}/actions/runs/${runId}`;
          const detectorSourcePath = [
            "scripts",
            "submit-bun-dependency-snapshot.ts",
          ].join("/");
          const expectedDetectorUrl =
            `https://github.com/loehrning-ai/platform/blob/main/${detectorSourcePath}`;

          const job = object(snapshot.job, "snapshot.job");
          if (job.correlator !== "bun-dependency-submission") {
            fail("snapshot.job.correlator is invalid");
          }
          if (job.id !== runId || job.html_url !== expectedJobUrl) {
            fail("snapshot.job must identify the current workflow run");
          }
          const detector = object(snapshot.detector, "snapshot.detector");
          if (
            detector.name !== "loehrning-bun-lock" ||
            detector.version !== "1.0.0" ||
            detector.url !== expectedDetectorUrl
          ) {
            fail("snapshot.detector is invalid");
          }
          const scanned = nonEmptyString(
            snapshot.scanned,
            "snapshot.scanned",
            32,
          );
          const scannedAt = Date.parse(scanned);
          const now = Date.now();
          if (
            !Number.isFinite(scannedAt) ||
            new Date(scannedAt).toISOString() !== scanned ||
            scannedAt > now + 5 * 60_000 ||
            scannedAt < now - 24 * 60 * 60_000
          ) {
            fail(
              "snapshot.scanned must be a canonical current ISO-8601 timestamp",
            );
          }

          const manifests = object(snapshot.manifests, "snapshot.manifests");
          if (
            Object.keys(manifests).length !== 1 ||
            !Object.hasOwn(manifests, "bun.lock")
          ) {
            fail("snapshot must contain exactly the bun.lock manifest");
          }
          const manifest = object(manifests["bun.lock"], "bun.lock manifest");
          if (
            manifest.name !== "bun.lock" ||
            object(manifest.file, "bun.lock file").source_location !== "bun.lock"
          ) {
            fail("bun.lock manifest identity is invalid");
          }
          const resolved = object(manifest.resolved, "bun.lock resolved graph");
          const entries = Object.entries(resolved);
          if (entries.length < 100 || entries.length > 20_000) {
            fail("resolved package count is outside the expected boundary");
          }
          const metadata = object(manifest.metadata, "bun.lock metadata");
          if (
            metadata.lockfile_version !== 1 ||
            metadata.resolved_package_count !== entries.length
          ) {
            fail("bun.lock metadata does not match the submitted lock graph");
          }

          const packageUrls = new Set(entries.map(([packageUrl]) => packageUrl));
          const direct = [];
          for (const [packageUrl, rawDependency] of entries) {
            nonEmptyString(packageUrl, "package URL");
            if (
              !/^pkg:npm\/(?:%40[A-Za-z0-9_.~-]+\/)?[A-Za-z0-9_.~-]+@[^/?#\s]+$/.test(
                packageUrl,
              )
            ) {
              fail("resolved graph contains a non-npm package URL");
            }
            const dependency = object(rawDependency, `dependency ${packageUrl}`);
            if (dependency.package_url !== packageUrl) {
              fail("dependency.package_url must equal its graph key");
            }
            if (
              dependency.relationship !== "direct" &&
              dependency.relationship !== "indirect"
            ) {
              fail("dependency relationship is invalid");
            }
            if (
              dependency.scope !== "runtime" &&
              dependency.scope !== "development"
            ) {
              fail("dependency scope is invalid");
            }
            if (dependency.relationship === "direct") direct.push(packageUrl);
            const children = dependency.dependencies ?? [];
            if (!Array.isArray(children) || children.length > 2_000) {
              fail("dependency edges must be a bounded array");
            }
            if (new Set(children).size !== children.length) {
              fail("dependency edges must be unique");
            }
            for (const child of children) {
              if (
                typeof child !== "string" ||
                child === packageUrl ||
                !packageUrls.has(child)
              ) {
                fail("dependency edge points outside the submitted graph");
              }
            }
          }
          if (direct.length === 0) fail("resolved graph has no direct dependency");

          const visited = new Set();
          const pending = [...direct];
          while (pending.length > 0) {
            const current = pending.pop();
            if (!current || visited.has(current)) continue;
            visited.add(current);
            pending.push(...(resolved[current].dependencies ?? []));
          }
          if (visited.size !== entries.length) {
            fail("resolved graph contains packages unreachable from direct dependencies");
          }

          if (
            process.env.GITHUB_API_URL &&
            process.env.GITHUB_API_URL !== "https://api.github.com"
          ) {
            fail("only the GitHub.com API origin is permitted");
          }
          const token = process.env.GITHUB_TOKEN;
          if (!token) fail("GITHUB_TOKEN is unavailable");

          const response = await fetch(
            `https://api.github.com/repos/${repository}/dependency-graph/snapshots`,
            {
              method: "POST",
              redirect: "error",
              signal: AbortSignal.timeout(30_000),
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                "X-GitHub-Api-Version": "2026-03-10",
              },
              body: JSON.stringify(snapshot),
            },
          );
          if (response.status !== 201) {
            fail(`GitHub returned unexpected HTTP status ${response.status}`);
          }
          let result;
          try {
            result = await response.json();
          } catch {
            fail("GitHub returned a non-JSON success response");
          }
          if (
            !result ||
            typeof result !== "object" ||
            result.result !== "SUCCESS"
          ) {
            fail("GitHub did not confirm SUCCESS");
          }
          console.log(
            `Submitted ${entries.length} Bun-locked dependency coordinates.`,
          );
          NODE
        env:
          GITHUB_TOKEN: ${{ github.token }}
