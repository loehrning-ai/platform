name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

# GitHub does not parse bun.lock for pull-request dependency snapshots, and a
# privileged pull_request_target submission would still lose write permission
# on Dependabot PRs while expanding the attack surface for fork data. Keep this
# workflow unprivileged. It reviews the dependency-graph diff GitHub can
# recognise and nothing else; the live `bun audit` runs nightly (nightly.yml,
# `bun run ci:hygiene`), because its result changes with the advisory database,
# not with the pull request. Informational for deploys: only `verify` gates.
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
