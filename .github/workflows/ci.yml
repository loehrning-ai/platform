name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Public browsers own at most 70 minutes and the auth scaffold owns at
    # most 10. The remaining 30 minutes cover install, full verification,
    # artifact upload, and teardown without letting one phase borrow another's
    # deadline.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
      - name: Install checksum-verified Bun
        run: bash .github/scripts/install-verified-bun.sh
      - run: bun install --frozen-lockfile --ignore-scripts
      # Root verify ends with verify:workspaces, which runs the workspace
      # verify (typecheck, lint, unit tests, production build). The built
      # e2e gates below reuse that build via next start.
      - run: bun run verify
      - name: Reject generated tracked-file drift
        run: git diff --exit-code --
      # Resolve only the Playwright binary already installed from bun.lock.
      - run: bun run --cwd packages/website playwright install --with-deps chromium webkit
      - name: Blocking Lighthouse performance smoke (uses verified build)
        run: |
          export CHROME_PATH="$(bun --cwd packages/website -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')"
          bun run lighthouse:ci:built
      - name: Public browser gate (uses verified build)
        run: bun run test:e2e:public:built
        env:
          E2E_GLOBAL_TIMEOUT: 4200000
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/public
          PLAYWRIGHT_OUTPUT_DIR: test-results/public
      - name: Provider-free auth scaffold gate (uses verified build)
        run: bun run test:e2e:auth-scaffold:built
        env:
          E2E_GLOBAL_TIMEOUT: 600000
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/auth-scaffold
          PLAYWRIGHT_OUTPUT_DIR: test-results/auth-scaffold
      - name: Upload browser failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-artifacts
          path: |
            packages/website/playwright-report/
            packages/website/test-results/
            packages/website/blob-report/
          if-no-files-found: ignore
          retention-days: 7
