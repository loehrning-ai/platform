name: Verify

# The application gate. Three jobs start together and `verify` aggregates them.
# Each job calls the same script a contributor runs locally (`bun run ci:<job>`,
# or `bun run ci` for all three); the breadth that left this path runs daily
# in nightly.yml. Contract: packages/website/docs/ci-contract.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  # A new commit supersedes the previous run of the same pull request. The push
  # to main is never cancelled: its `verify` is the release signal for that
  # exact commit, and a cancelled run is never a green one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run ci:static
      - name: Reject generated tracked-file drift
        run: git diff --exit-code --

  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run ci:unit

  browser:
    name: browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Set at the job level so the build and every step that serves it see one
    # identical environment (the build receipt hashes it, and the CSP drops
    # `upgrade-insecure-requests` only for a build proven to be loopback HTTP).
    env:
      E2E_SERVER_MODE: production
      E2E_PORT: "3000"
      # Below the job timeout, so a hang is a Playwright report, not a killed job.
      E2E_GLOBAL_TIMEOUT: 180000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright-browsers: chromium webkit
          next-build-cache: "true"
      - run: bun run ci:browser
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures
          path: packages/website/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The release signal: scripts/deploy-production.mjs reads this check-run by
  # name. `if: always()` is load-bearing: without it the job is skipped when a
  # dependency fails, and a skipped check is not a red one. Anything but
  # `success` (failure, cancelled, skipped) fails it. Keep this the only job
  # called `verify`, in this file and in every other workflow.
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: ${{ always() }}
    needs: [static, unit, browser]
    steps:
      - name: Every gate must be exactly success
        env:
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          status=0
          for gate in STATIC UNIT BROWSER; do
            result="${!gate}"
            echo "${gate,,}: ${result}"
            if [ "${result}" != "success" ]; then
              echo "::error::gate ${gate,,}: ${result}"
              status=1
            fi
          done
          exit "${status}"
