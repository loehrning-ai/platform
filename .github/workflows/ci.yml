name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # A push to main is the only run that verifies the commit that actually
  # landed (merges here are squash-only, so the PR run verified a different
  # tree). Never cancel it. PR runs remain cancel-on-push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Tier 1 — no production build required. First red arrives here, in ~2 min.
  # ---------------------------------------------------------------------------
  fast:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run verify:static
      - name: Reject generated tracked-file drift
        run: git diff --exit-code --

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run --cwd packages/website verify:unit

  # ---------------------------------------------------------------------------
  # Tier 2 — each job builds its own production output.
  #
  # The build is deliberately NOT handed between jobs as an artifact. The
  # build-freshness receipt re-hashes BUILD_ID, artifact digests, input digests
  # and the captured toolchain (including platformRelease()), so a downloaded
  # `.next` must land byte-identical on an identically-imaged runner or every
  # `:built` gate fails preflight. Rebuilding costs runner-minutes, which are
  # free on a public repo, and buys a gate that cannot fail for transport
  # reasons. Revisit only with measurements.
  #
  # Every job below sets E2E_SERVER_MODE/E2E_PORT at the JOB level, so every
  # step — the build and whatever serves/tests it — shares one identical
  # environment. The CSP's `upgrade-insecure-requests` directive is excluded
  # only when environment-policy.mjs's providerFreeVerificationEnvironment()
  # can prove, from those two vars, that this exact build is for loopback-HTTP
  # verification (deliberately fail-closed — a build that can't prove that
  # gets the production CSP, which DOES include the directive). Next.js
  # resolves next.config.ts's headers() once, at build time, and bakes the
  # result into the output for `next start` to serve; setting these vars only
  # on the serve/test step has zero effect on that already-baked CSP.
  # Omitting them entirely means the served CSP always includes
  # `upgrade-insecure-requests`, which WebKit enforces even for a page's own
  # same-origin HTTP subresources — every asset request silently upgrades to
  # HTTPS against a server that only speaks HTTP, fails with a TLS error, and
  # the page never finishes hydrating. That is a test-infrastructure bug, not
  # a WebKit defect: real production traffic is HTTPS already, so the
  # directive is correct and unaffected there.
  #
  # Setting them only on the build step (not the job) was tried first and
  # broke every gate below it in the same job: build-freshness's preflight
  # (run-built-gate.mjs) re-captures the toolchain/environment at build time
  # and compares it again before serving, so a build step with these vars and
  # a later step without them is a real, detected environment mismatch —
  # "Stale production build: source or build environment no longer matches
  # .next" — not a false positive. Job-level env makes every step identical.
  #
  # The exact port does not need to match the later serve port — the CSP
  # exclusion only requires E2E_SERVER_MODE=production plus any
  # structurally-valid E2E_PORT; server-log-privacy allocates its actual serve
  # port at runtime, so 3000 here is a valid placeholder, not a claim it will
  # match what that job serves on.
  # ---------------------------------------------------------------------------
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_SERVER_MODE: production
      E2E_PORT: "3000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright-browsers: chromium
      - run: bun run --cwd packages/website verify:build
      - name: Blocking Lighthouse performance smoke
        run: |
          export CHROME_PATH="$(bun --cwd packages/website -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')"
          bun run lighthouse:ci:built
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: e2e ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_SERVER_MODE: production
      E2E_PORT: "3000"
    strategy:
      # One red shard must not hide the other seventeen. The aggregate `verify`
      # job is what turns any failure into a red required check.
      fail-fast: false
      matrix:
        include:
          # Shard counts are sized from measured single-worker cost on run
          # 31380300054: chromium 29.4m, mobile-chromium 14.3m, mobile-webkit
          # ~30m extrapolated. Target is ~5 minutes of tests per shard.
          - { project: chromium, shard: 1, total: 6, browsers: chromium }
          - { project: chromium, shard: 2, total: 6, browsers: chromium }
          - { project: chromium, shard: 3, total: 6, browsers: chromium }
          - { project: chromium, shard: 4, total: 6, browsers: chromium }
          - { project: chromium, shard: 5, total: 6, browsers: chromium }
          - { project: chromium, shard: 6, total: 6, browsers: chromium }
          # Exhaustive desktop route matrices use isolated browser processes.
          # Keeping them in the general Chromium worker reproduced a renderer
          # deadlock after sustained route walking on two consecutive runs.
          - { project: chromium-ai-native-operator, shard: 1, total: 1, browsers: chromium }
          - { project: chromium-claude-responsive, shard: 1, total: 1, browsers: chromium }
          - { project: mobile-chromium, shard: 1, total: 3, browsers: chromium }
          - { project: mobile-chromium, shard: 2, total: 3, browsers: chromium }
          - { project: mobile-chromium, shard: 3, total: 3, browsers: chromium }
          - { project: mobile-webkit, shard: 1, total: 7, browsers: webkit }
          - { project: mobile-webkit, shard: 2, total: 7, browsers: webkit }
          - { project: mobile-webkit, shard: 3, total: 7, browsers: webkit }
          - { project: mobile-webkit, shard: 4, total: 7, browsers: webkit }
          - { project: mobile-webkit, shard: 5, total: 7, browsers: webkit }
          - { project: mobile-webkit, shard: 6, total: 7, browsers: webkit }
          - { project: mobile-webkit, shard: 7, total: 7, browsers: webkit }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright-browsers: ${{ matrix.browsers }}
      - run: bun run --cwd packages/website verify:build
      - name: Public browser gate
        run: >-
          bun run --cwd packages/website e2e:shard:built
          test
          --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/${{ matrix.total }}
          --retries=0
          --trace=retain-on-failure
        env:
          # Per-shard budget. The old 70-minute aggregate deadline is gone: it
          # bounded 23 serial launches, and on run 31380300054 it expired after
          # 7 of them, silently dropping ~500 tests. A shard now owns its own
          # clock and the job timeout is the real backstop.
          E2E_GLOBAL_TIMEOUT: 1800000
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/${{ matrix.project }}-${{ matrix.shard }}
          PLAYWRIGHT_OUTPUT_DIR: test-results/${{ matrix.project }}-${{ matrix.shard }}
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-${{ matrix.project }}-${{ matrix.shard }}
          path: packages/website/blob-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failures-${{ matrix.project }}-${{ matrix.shard }}
          path: packages/website/test-results/
          if-no-files-found: ignore
          retention-days: 7

  auth-scaffold:
    name: auth scaffold gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_SERVER_MODE: production
      E2E_PORT: "3000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright-browsers: chromium
      - run: bun run --cwd packages/website verify:build
      - name: Provider-free auth scaffold gate
        run: bun run test:e2e:auth-scaffold:built
        env:
          E2E_GLOBAL_TIMEOUT: 600000
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/auth-scaffold
          PLAYWRIGHT_OUTPUT_DIR: test-results/auth-scaffold

  server-log-privacy:
    name: server log privacy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_SERVER_MODE: production
      E2E_PORT: "3000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run --cwd packages/website verify:build
      - run: bun run --cwd packages/website test:server-log-privacy:built

  merge-reports:
    name: merge browser reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [e2e]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/website/all-blob-reports
          pattern: blob-*
          merge-multiple: true
      - name: Merge into one HTML report
        working-directory: packages/website
        run: node scripts/run-playwright.mjs merge-reports --reporter=html all-blob-reports
        continue-on-error: true
      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-report
          path: packages/website/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The required status check. Branch-protection ruleset 19653327 requires the
  # literal context `verify`, so this job keeps that name and no matrix job is
  # ever made required.
  #
  # `if: always()` is load-bearing: without it this job is *skipped* when any
  # dependency fails, and GitHub branch protection treats a skipped required
  # check as PASSING. The explicit result check below is what makes the gate red.
  # ---------------------------------------------------------------------------
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - fast
      - unit
      - lighthouse
      - e2e
      - auth-scaffold
      - server-log-privacy
    steps:
      - name: Report gate results
        run: |
          printf '%s\n' \
            "fast................. ${{ needs.fast.result }}" \
            "unit................. ${{ needs.unit.result }}" \
            "lighthouse........... ${{ needs.lighthouse.result }}" \
            "e2e.................. ${{ needs.e2e.result }}" \
            "auth-scaffold........ ${{ needs.auth-scaffold.result }}" \
            "server-log-privacy... ${{ needs.server-log-privacy.result }}"
      - name: Fail if any gate did not succeed
        if: >-
          ${{ contains(needs.*.result, 'failure')
           || contains(needs.*.result, 'cancelled')
           || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::At least one verification gate did not succeed."
          exit 1
