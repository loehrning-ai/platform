name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      # Root verify ends with verify:workspaces, which runs the workspace
      # verify (typecheck, lint, unit tests, production build). The built
      # e2e gates below reuse that build via next start.
      - run: bun run verify
      # Pin to the @playwright/test version resolved in bun.lock so the
      # browser binaries match the test runner.
      - run: bunx playwright@1.61.1 install --with-deps chromium webkit
      - name: Public browser gate (uses verified build)
        run: bun run test:e2e:public:built
      - name: Provider-free auth scaffold gate (uses verified build)
        run: bun run test:e2e:auth-scaffold:built
      - name: Upload browser failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-artifacts
          path: |
            packages/website/playwright-report/
            packages/website/test-results/
            packages/website/blob-report/
          if-no-files-found: ignore
          retention-days: 7
