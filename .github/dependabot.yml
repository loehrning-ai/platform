version: 2
updates:
  # Bun owns the workspace lockfile. Using the npm ecosystem updates only the
  # npm-compatible manifests and leaves bun.lock stale.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
