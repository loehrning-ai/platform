version: 2
updates:
  # Bun owns the workspace lockfile. Using the npm ecosystem updates only the
  # npm-compatible manifests and leaves bun.lock stale.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A version is proposed only once it is 3 days old. A hijacked or broken
    # release is usually caught and pulled within that window, before its code
    # reaches a pull request or a preview build. Security updates bypass the
    # cooldown; ignored major upgrades still need a reviewed migration.
    cooldown:
      default-days: 3
    # Minor and patch updates arrive in two pull requests: the framework
    # (next, react) on its own, so a Next or React bump is reviewed and rolled
    # back without tooling noise, and everything else together. Major upgrades
    # use dedicated migration pull requests. Groups are matched in order, so
    # the framework group claims its packages first.
    groups:
      bun-framework-minor-and-patch:
        applies-to: version-updates
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom", "eslint-config-next", "@next/*"]
        update-types: [minor, patch]
      bun-tooling-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Major upgrades need a migration: Vite/plugin-react, Sentry, Vitest,
      # Framer Motion and Node typings have incompatible major releases.
      # This single rule covers every dependency. It can also hold back a
      # security fix requiring a major; the unsuppressed audit still reports it.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
