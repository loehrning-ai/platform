<!doctype html>
<html lang="en" data-deck-id="audit-vorbereitung-mit-ki:en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f3f0e9" />
<meta name="robots" content="noindex" />
<title>Presenter view · Audit preparation with AI · loehrning.ai</title>
<link rel="icon" href="../assets/favicon.svg" />
<link rel="stylesheet" href="../lib/fonts.css" />
<link rel="stylesheet" href="../lib/presenter.css" />
<script src="../lib/presenter.js" defer></script>
</head>
<body data-slug="audit-vorbereitung-mit-ki:en">
<a class="deck-back" href="/en/workshops/audit-vorbereitung-mit-ki" aria-label="Back to the workshop page">← Workshop</a>
<header class="pv-head">
  <span id="pv-pos" class="pv-pos">Slide 00 / 00</span>
  <span id="pv-label" class="pv-label"></span>
  <span class="pv-sp"></span>
  <span id="pv-step" class="pv-step"></span>
  <span id="pv-conn" class="pv-conn" data-state="waiting" role="status" aria-live="polite">Not connected: open the deck and press P</span>
</header>
<main class="pv-grid" id="main">
  <section class="pv-notes" aria-labelledby="pv-title">
    <h1 id="pv-title">Waiting for the deck</h1>
    <p id="pv-plan" class="pv-time"></p>
    <div id="pv-note" class="pv-note"></div>
  </section>
  <aside class="pv-side" aria-label="Time and next slide">
    <div class="pv-box"><h2>This slide</h2><div id="pv-tslide" class="pv-big">0:00</div><div id="pv-tplan" class="pv-small"></div></div>
    <div class="pv-box"><h2>Session</h2><div id="pv-tsess" class="pv-big">0:00</div><div id="pv-tpace" class="pv-small"></div></div>
    <div class="pv-box pv-next" id="pv-next">
      <h2>Next slide</h2>
      <b id="pv-nlab"></b>
      <p id="pv-ntime"></p>
      <div class="pv-frame"><iframe id="pv-next-frame" src="./slides.html?preview=1" title="Next slide" tabindex="-1" aria-hidden="true"></iframe></div>
    </div>
  </aside>
</main>
<footer class="pv-foot">
  <button type="button" id="pv-prev" class="pv-btn">← Back</button>
  <button type="button" id="pv-forward" class="pv-btn">Next →</button>
  <button type="button" id="pv-reset" class="pv-btn">From the start (r)</button>
  <button type="button" id="pv-return" class="pv-btn" hidden></button>
  <button type="button" id="pv-timer-reset" class="pv-btn">Restart timers</button>
  <label class="pv-jump" for="pv-select"><span>Jump to</span><select id="pv-select"></select></label>
  <span class="pv-keys">→ ← step. r or Shift+R: start. Esc: leave the appendix. In the deck, P opens this view.</span>
</footer>
</body>
</html>
