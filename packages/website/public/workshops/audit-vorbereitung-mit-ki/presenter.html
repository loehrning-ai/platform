<!doctype html>
<html lang="de" data-deck-id="audit-vorbereitung-mit-ki">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f3f0e9" />
<meta name="robots" content="noindex" />

<link rel="icon" href="./assets/favicon.svg" />

<link rel="stylesheet" href="./lib/presenter.css" />

<body data-slug="audit-vorbereitung-mit-ki">
<a class="deck-back" href="/workshops/audit-vorbereitung-mit-ki" aria-label="Zurück zur Workshop-Seite">← Workshop</a>
<header class="pv-head">
  <span id="pv-pos" class="pv-pos">Folie 00 / 00</span>
  <span id="pv-label" class="pv-label"></span>
  <span class="pv-sp"></span>
  <span id="pv-step" class="pv-step"></span>
  <span id="pv-conn" class="pv-conn" data-state="waiting" role="status" aria-live="polite">Nicht verbunden: Deck öffnen und P drücken</span>
</header>
<main class="pv-grid" id="main">
  <section class="pv-notes" aria-labelledby="pv-title">
    <h1 id="pv-title">Warte auf das Deck</h1>
    <p id="pv-plan" class="pv-time"></p>
    <div id="pv-note" class="pv-note"></div>
  </section>
  <aside class="pv-side" aria-label="Zeit und nächste Folie">
    <div class="pv-box"><h2>Diese Folie</h2><div id="pv-tslide" class="pv-big">0:00</div><div id="pv-tplan" class="pv-small"></div></div>
    <div class="pv-box"><h2>Sitzung</h2><div id="pv-tsess" class="pv-big">0:00</div><div id="pv-tpace" class="pv-small"></div></div>
    <div class="pv-box pv-next" id="pv-next">
      <h2>Nächste Folie</h2>
      <b id="pv-nlab"></b>
      <p id="pv-ntime"></p>
      <div class="pv-frame"><iframe id="pv-next-frame" src="./slides.html?preview=1" title="Nächste Folie" tabindex="-1" aria-hidden="true"></iframe></div>
    </div>
  </aside>
</main>
<footer class="pv-foot">
  <button type="button" id="pv-prev" class="pv-btn">← Zurück</button>
  <button type="button" id="pv-forward" class="pv-btn">Weiter →</button>
  <button type="button" id="pv-reset" class="pv-btn">Von vorn (r)</button>
  <button type="button" id="pv-return" class="pv-btn" hidden></button>
  <button type="button" id="pv-timer-reset" class="pv-btn">Zeit neu starten</button>
  <label class="pv-jump" for="pv-select"><span>Springen zu</span><select id="pv-select"></select></label>
  <span class="pv-keys">→ ← Schritt. r oder Shift+R: Anfang. Esc: Anhang verlassen. Im Deck öffnet P diese Ansicht.</span>
</footer>
