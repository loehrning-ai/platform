# FOLDLINE access and behaviour policy (synthetic teaching data)
# =====================================================================================
# In plain words
#   This file says what the AI's login may read, when the AI must ask back or say no,
#   and what happens when data is old. It is written down so people, tests and Claude
#   agree. It does NOT lock anything by itself.
#
#   Two locks: refuse early, enforce anyway.
#     - "refuse early" = instructions and an optional application check stop a bad
#       request before any SQL runs (clarify, refuse).
#     - "enforce anyway" = PostgreSQL grants make a forbidden read fail (SQLSTATE 42501),
#       even if every instruction is ignored.
#
# Every rule below is tagged with what backs it:
#   backed_by: guides       CLAUDE.md (Claude Code), the Agent Skill
#                           (.claude/skills/foldline-analytics/SKILL.md, loaded when its
#                           description matches), Project instructions (Claude Projects).
#                           Claude may ignore them. Files: ../claude/README.md.
#   backed_by: application  hooks/sql_guard.py (optional, Claude Code only). A client-side check.
#   backed_by: database     grants and role settings in warehouse/sql/60_access.sql.
#   A rule with only "guides" is a request, not a control.
#
# The builder kit ships no policy engine. The workshop's course policy was application
# code in the demo system; here the same rules are carried by instructions, the optional
# hook and the grants.
# =====================================================================================

version: 1                                   # Format version.

policy:
  identity: foldline_ready_reader            # The LOGIN the AI uses. One login per AI surface.
  # Counter-example: the template used a generic "ai_analytics_reader"; the export lane's
  # foldline_bad_reader could read all 7 tables. Name the real login so a test can connect as it.

  # -----------------------------------------------------------------------------------
  # ALLOW: an allowlist. Anything not named here is out of scope.
  # -----------------------------------------------------------------------------------
  allow:
    backed_by: [database, guides]            # GRANT USAGE on analytics + SELECT on exactly these five views.
    operations: [select]
    schemas: [analytics]
    relations:                               # Exactly five. Test B-P01 counts the grants.
      - analytics.mrr_summary_monthly
      - analytics.logo_churn_by_segment_quarter
      - analytics.expansion_mrr_by_country_monthly
      - analytics.account_mrr_monthly
      - analytics.data_status_by_view
    metrics:                                 # Approved metrics (metric.yml). The two status: example metrics
      - ending_mrr                           # (active_accounts, avg_mrr_per_active_account) are for learning; to serve
                                             # one, add it here and bump this file. Until then it is refused.
      - net_new_mrr
      - logo_churn_rate
      - expansion_mrr
      - account_ending_mrr
    # Why an allowlist: a deny list such as the template's [raw, core, staging] is a
    # denylist. If the grants followed that list alone, a new schema such as tmp_export
    # would be open the day someone creates it. An allowlist plus grants on named views
    # fails closed: a new object is invisible until someone grants it.

  # -----------------------------------------------------------------------------------
  # DENY: written for people and tests. The database already denies all of it, because
  # nothing here was granted.
  # -----------------------------------------------------------------------------------
  deny:
    backed_by: [database, guides]
    schemas_not_granted: [source, core, public]   # Listed for readers. The lock is the missing grant.
    databases_not_granted: [saas_bad]        # REVOKE CONNECT; test B-X01.
    columns:                                 # Direct identifiers. They exist only in core and source.
      - account_name
      - contact_email
      - phone
      - address
    operations: [insert, update, delete, truncate, create, alter, drop, copy, temp]   # Tests B-W01, B-T01.

  # -----------------------------------------------------------------------------------
  # EXECUTION LIMITS: guardrails, not locks.
  # -----------------------------------------------------------------------------------
  execution:
    backed_by: [database, application]
    max_rows: 1000                           # Detail queries on analytics.account_mrr_monthly need LIMIT <= 1000.
    require_limit_for_detail: true
    statement_timeout_ms: 5000               # ALTER ROLE ... SET statement_timeout = '5s'.
    single_statement_only: true              # Enforced only by the optional hook or the connector.
    schema_qualified_names_only: true        # search_path is '' on the role; test B-S01 expects 42P01.
    note: >-
      guardrail: role defaults a client can override. PostgreSQL applies role settings
      at login; the reader can still run SET statement_timeout = 0 or BEGIN READ WRITE.
      The connector or hook must also enforce these limits. The locks are the missing
      write, TEMP and CREATE privileges plus SELECT on five named views.

  # -----------------------------------------------------------------------------------
  # BEHAVIOUR: what the AI does before it writes SQL. Backed by guides (and the hook
  # where noted). The database cannot ask back; only these rules can.
  # -----------------------------------------------------------------------------------
  behavior:
    clarify:
      - id: bare_mrr                         # Case C01.
        backed_by: [guides]
        condition: The question says MRR (or revenue) without naming ending, net new or a movement component, or without a period.
        message: "Specify the MRR meaning: ending MRR, net-new MRR, or an MRR movement component."
        query_must_not_execute: true
        # Counter-example: answering "How much MRR?" with a guess. The lab result read
        # "Answered “How much MRR?” without asking which MRR was meant."

    refuse:
      - id: profit                           # Case R01.
        backed_by: [guides]
        condition: The question needs profit, margin, cost, COGS or recognised revenue.
        message: "Profit cannot be calculated because the approved dataset contains no cost, COGS, recognized-revenue, or approved profit definition. MRR is not a profit proxy."
        query_must_not_execute: true
        # Counter-example: answering profit with MRR "as a proxy". It silently changes the question.
      - id: direct_identifiers               # Case R02.
        backed_by: [guides, application, database]
        condition: The question asks for names, emails, phone numbers, addresses or other direct identifiers.
        message: "Direct customer identifiers are outside the approved AI data surface. Use approved pseudonymous analytics keys or an authorized operational workflow."
        query_must_not_execute: true
        # If the refusal fails, D01 proves the database still denies the read (42501).
      - id: undefined_metric
        backed_by: [guides]
        condition: The metric is not listed in allow.metrics above.
        message: "The approved data surface does not define this metric. Ask revenue_analytics to add a definition."
        query_must_not_execute: true
      - id: labelled_proxy
        backed_by: [guides]
        condition: A proxy is requested.
        rule: Refuse unless the user explicitly asks for a labelled proxy AND this policy lists that proxy. This policy lists none.

    freshness:
      backed_by: [guides]
      source: analytics.data_status_by_view  # Read first, every time.
      evaluation_clock: stated_clock         # The clock in the question; else 2026-07-01T09:00:00Z in this course.
      warn:
        condition: age_hours > warn_after_hours   # 36.
        action: answer_with_freshness_warning
        message: "Data loaded at <data_loaded_at_utc>, <age> h before the evaluation clock <clock>. The warning threshold is 36 h."
        # F00: 3 h -> fresh, answer. F01: 60 h -> answer with the warning.
      block:                                 # The ONLY conditions that stop an answer.
        - condition: requested_period_after_complete_through
          action: refuse_before_query
          message: "The requested period is not complete on the approved serving view."
        - condition: quality_status_not_passing
          action: refuse_before_query
          message: "The serving view has not passed its required quality gate."
      hard_expiry_hours: null                # No block by age was written. Escalate to revenue_analytics; do not invent one.

    period:
      backed_by: [guides]
      rules:
        - Never add ending MRR (or any snapshot) across months.
        - Add movements only inside complete periods.
        - Recompute rates and averages from numerators and denominators; never average them.

    trace:                                   # Every answer ends with this. Tests grade it.
      backed_by: [guides]
      required: [metric_name, metric_version, exact_period, unit, relation, data_loaded_at_utc, age_hours, evaluation_clock, freshness_state, limitations]
      # Counter-example: the recorded runs used an approved example 3 of 3 but cited the
      # definition 0 of 3. Loaded is not the same as used. Only a required trace makes
      # use observable.

  # -----------------------------------------------------------------------------------
  # ENFORCEMENT MAP: the honest summary.
  # -----------------------------------------------------------------------------------
  enforcement:
    summary: "Two locks: refuse early, enforce anyway."
    guides:                                  # Claude reads these and usually follows them. No guarantee.
      - claude/CLAUDE.example.md
      - claude/skills/foldline-analytics/SKILL.md
      - claude/project/PROJECT-INSTRUCTIONS.txt
    application:                             # Optional. Runs in Claude Code only, on the client.
      - claude/hooks/sql_guard.py            # Registered by claude/settings.example.json (copy to .claude/settings.json).
    database:                                # Applies to every client, every tool, every person with this login.
      - warehouse/sql/60_access.sql
    application_policy_required: false       # The builder ships no policy engine; the hook is optional.
    database_grants_required: true           # Without the grants there is no lock at all.
