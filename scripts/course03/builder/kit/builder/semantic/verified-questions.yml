# FOLDLINE verified questions (synthetic teaching data)
# =====================================================================================
# In plain words
#   A verified question is a question with its right answer written down BEFORE anyone
#   asks the AI. A test compares what came back with what is written here.
#
# Where the expected rows come from
#   - From the seed (warehouse/seed/generate_seed.py asserts every fixed fact) AND an
#     independent check by a second person. Never from the AI under test.
#   - truth_source on each case says which.
#
# How to grade
#   - Grade by VALUE and BEHAVIOUR, never by SQL text. Two different correct queries are
#     both correct. A pretty query with a wrong number is wrong.
#   - Numbers compare as numbers (334675 = 334675.00). Row order matters only where
#     compare.order says "exact".
#   - The clock is frozen: evaluation_clock is part of the case. Never use now().
#
# Two evidence planes. Never merge them into one score.
#   plane: db_check  Deterministic. Tests the database and the course rules, NOT the AI.
#                    Run by warehouse/sql/70_checks.sql as the LOGIN foldline_ready_reader.
#                    Connect as that login (psql -U foldline_ready_reader). SET ROLE skips
#                    role settings such as search_path and the read-only default, so
#                    B-S01 would pass or fail for the wrong reason.
#   A case is identified by (plane, id): G01 exists once per plane on purpose.
#   plane: ai_run    Claude answers the question. Run each case at least 3 times per AI
#                    route and log every run in claude-demo/AI-RUN-LOG.md. One run is an
#                    observation, not a benchmark. Say "same AI route", never "same model".
#
# Mapping to the deck
#   The deck's nine database checks are G01-G05, C01, R01, R02, D01 ("9 of 9 ... not the
#   AI"). F00 and F01 add the freshness clock. B- cases check the builder's access setup.
#   Q- cases check reconciliations (Q07: declared lineage). T- cases are teaching examples
#   for the extra metric shapes; 70_checks.sql runs them too.
#   template_id names the same case in the kit's semantic-template/verified-questions.yml,
#   which uses the same ids (G01, C01, R01, R02, D01, F01).
#   C01, R01 and R02 belong to the AI/policy plane: the builder has no policy engine.
#   In the deck they were course rules checked outside the AI tool, before any SQL. Here
#   Claude's instructions carry them, which guides and does not enforce. A pass is
#   guidance evidence, not the deck's C01/R01/R02 result. R02 stays backed by D01 (42501).
# =====================================================================================

version: 1

defaults:
  evaluation_clock: "2026-07-01T09:00:00Z"   # Frozen clock for every case unless a case overrides it.
  dataset: foldline_saas_2026q2               # Loaded 2026-07-01T06:00:00Z, complete through 2026-06-01.
  run_as: foldline_ready_reader               # A login, not SET ROLE.
  metric_version: 1.0.0
  compare:
    numeric_tolerance: 0                      # Money is exact. Percent compares at one decimal.
    order: exact                              # Unless a case says otherwise.

cases:

  # ===================================================================================
  # plane: db_check  -- the deck's gold cases, with the deck's exact fixedSql
  # ===================================================================================
  - id: G01
    plane: db_check
    template_id: G01
    question: Show ending MRR by month for the last complete quarter.
    expected_behavior: answer
    metric: ending_mrr
    relation: analytics.mrr_summary_monthly
    truth_source: fixed fact (deck) + seed assertion + independent recount
    sql: |
      SELECT month_start, ending_mrr_eur
      FROM analytics.mrr_summary_monthly
      WHERE month_start >= DATE '2026-04-01' AND month_start < DATE '2026-07-01'
      ORDER BY month_start
    expected_rows:
      - {month_start: "2026-04-01", ending_mrr_eur: 334675}
      - {month_start: "2026-05-01", ending_mrr_eur: 344450}
      - {month_start: "2026-06-01", ending_mrr_eur: 387015}
    # Counter-example rows (never accept): -19960 / 9775 / 42565 (monthly changes),
    # 75890 / 85665 / 128230 (running totals with no opening balance), 1066140 (sum of levels).

  - id: G02
    plane: db_check
    question: What was net new MRR in the last complete quarter?
    expected_behavior: answer
    metric: net_new_mrr
    relation: analytics.mrr_summary_monthly
    truth_source: fixed fact (deck); equals 387015 - 354635
    sql: |
      SELECT sum(net_new_mrr_eur)::numeric(14,2) AS net_new_mrr_eur
      FROM analytics.mrr_summary_monthly
      WHERE month_start >= DATE '2026-04-01' AND month_start < DATE '2026-07-01'
    expected_rows:
      - {net_new_mrr_eur: 32380}
    # Counter-example (never accept): -17595 = 42565 - 60160, two changes subtracted as levels.

  - id: G03
    plane: db_check
    question: What was logo churn rate by customer segment in the last complete quarter?
    expected_behavior: answer
    metric: logo_churn_rate
    relation: analytics.logo_churn_by_segment_quarter
    truth_source: fixed fact (deck)
    sql: |
      SELECT
        customer_segment,
        starting_accounts,
        churned_accounts,
        logo_churn_rate_pct
      FROM analytics.logo_churn_by_segment_quarter
      WHERE period_start = DATE '2026-04-01'
        AND period_end_exclusive = DATE '2026-07-01'
      ORDER BY customer_segment
    expected_rows:
      - {customer_segment: Enterprise, starting_accounts: 40, churned_accounts: 4, logo_churn_rate_pct: 10.0}
      - {customer_segment: Mid-Market, starting_accounts: 40, churned_accounts: 4, logo_churn_rate_pct: 10.0}
      - {customer_segment: SMB, starting_accounts: 40, churned_accounts: 4, logo_churn_rate_pct: 10.0}
    # Counter-example (never accept): 48 / 4 / 8.33 per segment (new accounts in the base);
    # 0 of 0 reported as 0 %.

  - id: G04
    plane: db_check
    question: Show expansion MRR by country for the last complete quarter.
    expected_behavior: answer
    metric: expansion_mrr
    relation: analytics.expansion_mrr_by_country_monthly
    truth_source: recorded replay (deck appendix) + seed assertion
    sql: |
      SELECT country_code, sum(expansion_mrr_eur)::numeric(14,2) AS expansion_mrr_eur
      FROM analytics.expansion_mrr_by_country_monthly
      WHERE month_start >= DATE '2026-04-01' AND month_start < DATE '2026-07-01'
      GROUP BY country_code
      ORDER BY expansion_mrr_eur DESC, country_code
    expected_rows:
      - {country_code: CH, expansion_mrr_eur: 1990}
      - {country_code: DE, expansion_mrr_eur: 1780}
      - {country_code: FR, expansion_mrr_eur: 1780}
      - {country_code: SE, expansion_mrr_eur: 1780}
      - {country_code: NL, expansion_mrr_eur: 1655}
      - {country_code: PL, expansion_mrr_eur: 1640}
      - {country_code: AT, expansion_mrr_eur: 1565}
      - {country_code: GB, expansion_mrr_eur: 705}

  - id: G05
    plane: db_check
    question: Which ten pseudonymous accounts had the highest ending MRR in June 2026?
    expected_behavior: answer
    metric: account_ending_mrr
    relation: analytics.account_mrr_monthly
    truth_source: recorded replay (deck appendix) + seed assertion (every other account below 7235)
    sql: |
      SELECT account_key, customer_segment, country_code, plan_name, ending_mrr_eur
      FROM analytics.account_mrr_monthly
      WHERE month_start = DATE '2026-06-01' AND ending_mrr_eur > 0
      ORDER BY ending_mrr_eur DESC, account_key
      LIMIT 10
    expected_rows:
      - {account_key: fl_0006, customer_segment: Enterprise, country_code: PL, plan_name: Enterprise, ending_mrr_eur: 7705}
      - {account_key: fl_0132, customer_segment: Enterprise, country_code: NL, plan_name: Enterprise, ending_mrr_eur: 7695}
      - {account_key: fl_0060, customer_segment: Enterprise, country_code: NL, plan_name: Enterprise, ending_mrr_eur: 7595}
      - {account_key: fl_0114, customer_segment: Enterprise, country_code: AT, plan_name: Enterprise, ending_mrr_eur: 7435}
      - {account_key: fl_0078, customer_segment: Enterprise, country_code: PL, plan_name: Enterprise, ending_mrr_eur: 7385}
      - {account_key: fl_0042, customer_segment: Enterprise, country_code: AT, plan_name: Enterprise, ending_mrr_eur: 7335}
      - {account_key: fl_0069, customer_segment: Enterprise, country_code: FR, plan_name: Enterprise, ending_mrr_eur: 7280}
      - {account_key: fl_0033, customer_segment: Enterprise, country_code: DE, plan_name: Enterprise, ending_mrr_eur: 7265}
      - {account_key: fl_0123, customer_segment: Enterprise, country_code: CH, plan_name: Enterprise, ending_mrr_eur: 7250}
      - {account_key: fl_0087, customer_segment: Enterprise, country_code: SE, plan_name: Enterprise, ending_mrr_eur: 7235}

  - id: D01
    plane: db_check
    template_id: D01
    question: Forced private read (the AI or a person runs it directly).
    expected_behavior: database_deny
    truth_source: PostgreSQL privilege system
    sql: |
      SELECT contact_email FROM core.accounts LIMIT 1
    expected_sqlstate: "42501"                # insufficient_privilege: "permission denied for schema core".

  # ===================================================================================
  # plane: db_check  -- builder access setup (B-)
  # ===================================================================================
  - id: B-W01
    plane: db_check
    question: Can the reader write, even after overriding the read-only default?
    expected_behavior: database_deny
    truth_source: PostgreSQL privilege system (verified on PostgreSQL 16)
    sql: |
      BEGIN READ WRITE;
      CREATE TABLE analytics.b_w01_probe (probe integer);
    expected_sqlstate: "42501"                # permission denied for schema analytics (no CREATE).
    note: >-
      Without BEGIN READ WRITE the same statement fails with 25006 (read-only
      transaction). That only shows the DEFAULT, which the reader can override, so it is
      not the lock. An UPDATE on an aggregate view such as analytics.mrr_summary_monthly
      fails with 55000 ("cannot update view") before privileges are checked, so it proves
      nothing about grants either. Roll back after the probe.

  - id: B-T01
    plane: db_check
    question: Can the reader create temporary tables?
    expected_behavior: database_deny
    truth_source: PostgreSQL privilege system (verified on PostgreSQL 16)
    sql: |
      BEGIN READ WRITE;
      CREATE TEMP TABLE b_t01_probe (probe integer);
    expected_sqlstate: "42501"                # Passes only after REVOKE TEMP ON DATABASE saas_ready FROM PUBLIC.

  - id: B-S01
    plane: db_check
    question: Does an unqualified view name fail?
    expected_behavior: database_error
    truth_source: role setting search_path = '' (applies at login only)
    sql: |
      SELECT month_start FROM mrr_summary_monthly LIMIT 1
    expected_sqlstate: "42P01"                # undefined_table. The schema-qualified name works (G01).
    note: The deck's recorded ready run leaned on search_path analytics,public. This case keeps that gap closed.

  - id: B-X01
    plane: db_check
    question: Can the reader connect to the export lane?
    expected_behavior: answer
    truth_source: REVOKE CONNECT ON DATABASE saas_bad FROM PUBLIC (and no grant to the reader)
    sql: |
      SELECT has_database_privilege(current_user, 'saas_bad', 'CONNECT') AS can_connect_saas_bad
    expected_rows:
      - {can_connect_saas_bad: false}
    note: PUBLIC holds CONNECT on every new database by default. Without the REVOKE this returns true.

  - id: B-P01
    plane: db_check
    question: Does the reader hold exactly five SELECT grants, all on analytics?
    expected_behavior: answer
    truth_source: 60_access.sql
    compare: {order: exact}
    sql: |
      SELECT table_schema, table_name, privilege_type
      FROM information_schema.role_table_grants
      WHERE grantee = current_user
      ORDER BY table_name
    expected_rows:
      - {table_schema: analytics, table_name: account_mrr_monthly, privilege_type: SELECT}
      - {table_schema: analytics, table_name: data_status_by_view, privilege_type: SELECT}
      - {table_schema: analytics, table_name: expansion_mrr_by_country_monthly, privilege_type: SELECT}
      - {table_schema: analytics, table_name: logo_churn_by_segment_quarter, privilege_type: SELECT}
      - {table_schema: analytics, table_name: mrr_summary_monthly, privilege_type: SELECT}

  # ===================================================================================
  # plane: db_check  -- reconciliations (Q-)
  # ===================================================================================
  - id: Q01
    plane: db_check
    question: Is every view unique at its declared grain?
    expected_behavior: answer
    truth_source: model.yml primary_key
    sql: |
      SELECT 'analytics.mrr_summary_monthly' AS relation, count(*) - count(DISTINCT month_start) AS duplicate_rows
      FROM analytics.mrr_summary_monthly
      UNION ALL
      SELECT 'analytics.logo_churn_by_segment_quarter', count(*) - count(DISTINCT (period_start, customer_segment))
      FROM analytics.logo_churn_by_segment_quarter
      UNION ALL
      SELECT 'analytics.expansion_mrr_by_country_monthly', count(*) - count(DISTINCT (month_start, country_code))
      FROM analytics.expansion_mrr_by_country_monthly
      UNION ALL
      SELECT 'analytics.account_mrr_monthly', count(*) - count(DISTINCT (month_start, account_key))
      FROM analytics.account_mrr_monthly
      ORDER BY relation
    expected_rows:
      - {relation: analytics.account_mrr_monthly, duplicate_rows: 0}
      - {relation: analytics.expansion_mrr_by_country_monthly, duplicate_rows: 0}
      - {relation: analytics.logo_churn_by_segment_quarter, duplicate_rows: 0}
      - {relation: analytics.mrr_summary_monthly, duplicate_rows: 0}

  - id: Q02
    plane: db_check
    question: Does the bathtub identity hold (last level + change = new level)?
    expected_behavior: answer
    truth_source: metric.yml reconciliation; fixed facts 354635 + 32380 = 387015
    sql: |
      SELECT
        (SELECT ending_mrr_eur FROM analytics.mrr_summary_monthly WHERE month_start = DATE '2026-03-01') AS march_ending_mrr_eur,
        (SELECT sum(net_new_mrr_eur) FROM analytics.mrr_summary_monthly
          WHERE month_start >= DATE '2026-04-01' AND month_start < DATE '2026-07-01') AS q2_net_new_mrr_eur,
        (SELECT ending_mrr_eur FROM analytics.mrr_summary_monthly WHERE month_start = DATE '2026-06-01') AS june_ending_mrr_eur,
        (SELECT count(*) FROM (
            SELECT ending_mrr_eur, net_new_mrr_eur,
                   lag(ending_mrr_eur) OVER (ORDER BY month_start) AS previous_ending_mrr_eur
            FROM analytics.mrr_summary_monthly) m
          WHERE previous_ending_mrr_eur IS NOT NULL
            AND previous_ending_mrr_eur + net_new_mrr_eur <> ending_mrr_eur) AS months_breaking_identity
    expected_rows:
      - {march_ending_mrr_eur: 354635, q2_net_new_mrr_eur: 32380, june_ending_mrr_eur: 387015, months_breaking_identity: 0}

  - id: Q03
    plane: db_check
    question: Do the views stop at the complete month?
    expected_behavior: answer
    truth_source: load status (complete through 2026-06-01)
    sql: |
      SELECT max(month_start) AS last_month_served, max(complete_through_month) AS complete_through_month,
             count(*) FILTER (WHERE month_start > complete_through_month) AS rows_after_complete
      FROM analytics.mrr_summary_monthly
    expected_rows:
      - {last_month_served: "2026-06-01", complete_through_month: "2026-06-01", rows_after_complete: 0}

  - id: Q04
    plane: db_check
    question: Do accounts reconcile per segment (start - churned + new = end)?
    expected_behavior: answer
    truth_source: fixed facts 40 - 4 + 8 = 44 per segment
    sql: |
      SELECT customer_segment,
             count(*) FILTER (WHERE m03 > 0) AS starting_accounts,
             count(*) FILTER (WHERE m03 > 0 AND m06 = 0) AS churned_accounts,
             count(*) FILTER (WHERE m03 = 0 AND m06 > 0) AS new_accounts,
             count(*) FILTER (WHERE m06 > 0) AS ending_accounts
      FROM (
        SELECT account_key, customer_segment,
               sum(ending_mrr_eur) FILTER (WHERE month_start = DATE '2026-03-01') AS m03,
               sum(ending_mrr_eur) FILTER (WHERE month_start = DATE '2026-06-01') AS m06
        FROM analytics.account_mrr_monthly
        GROUP BY account_key, customer_segment
      ) a
      GROUP BY customer_segment
      ORDER BY customer_segment
    expected_rows:
      - {customer_segment: Enterprise, starting_accounts: 40, churned_accounts: 4, new_accounts: 8, ending_accounts: 44}
      - {customer_segment: Mid-Market, starting_accounts: 40, churned_accounts: 4, new_accounts: 8, ending_accounts: 44}
      - {customer_segment: SMB, starting_accounts: 40, churned_accounts: 4, new_accounts: 8, ending_accounts: 44}
    note: >-
      new_accounts counts accounts at 0 in March and above 0 in June. That equals the Q2
      joiners only because no Q2 joiner churned inside Q2 in this seed.

  - id: Q05
    plane: db_check
    question: Do the accounts add up to the company level every month?
    expected_behavior: answer
    truth_source: model.yml relationship account_mrr_monthly -> mrr_summary_monthly
    sql: |
      SELECT count(*) AS months_checked,
             count(*) FILTER (WHERE a.account_sum_eur <> s.ending_mrr_eur) AS months_mismatched
      FROM analytics.mrr_summary_monthly s
      JOIN (SELECT month_start, sum(ending_mrr_eur) AS account_sum_eur
            FROM analytics.account_mrr_monthly GROUP BY month_start) a USING (month_start)
    expected_rows:
      - {months_checked: 18, months_mismatched: 0}

  - id: Q06
    plane: db_check
    question: Does the catalog comment carry the definition version?
    expected_behavior: answer
    truth_source: 40_analytics.sql COMMENT ON VIEW; metric.yml version
    sql: |
      SELECT obj_description('analytics.mrr_summary_monthly'::regclass, 'pg_class') LIKE '%definition 1.0.0%' AS comment_has_version
    expected_rows:
      - {comment_has_version: true}
    note: Compiled is not consumed. This proves the catalog reader got the version, not that Claude used it.

  - id: Q07
    plane: db_check
    question: Do the views read exactly the relations that model.yml declares?
    expected_behavior: answer
    truth_source: model.yml lineage.upstream, compared with pg_depend
    sql: |
      SELECT v.relname AS view_name,
             string_agg(DISTINCT tn.nspname || '.' || t.relname, ', ') AS upstreams
      FROM pg_catalog.pg_class v
      JOIN pg_catalog.pg_rewrite r ON r.ev_class = v.oid
      JOIN pg_catalog.pg_depend d ON d.objid = r.oid AND d.classid = 'pg_catalog.pg_rewrite'::regclass
                                 AND d.refclassid = 'pg_catalog.pg_class'::regclass
      JOIN pg_catalog.pg_class t ON t.oid = d.refobjid AND t.oid <> v.oid
      JOIN pg_catalog.pg_namespace tn ON tn.oid = t.relnamespace
      WHERE v.relnamespace = 'analytics'::regnamespace AND v.relkind = 'v'
      GROUP BY v.relname
    expected_rows:
      - {view_name: account_mrr_monthly, upstreams: "core.account_months, core.accounts, core.load_status"}
      - {view_name: data_status_by_view, upstreams: "core.load_status, core.serving_contracts"}
      - {view_name: expansion_mrr_by_country_monthly, upstreams: "core.account_months, core.accounts, core.load_status"}
      - {view_name: logo_churn_by_segment_quarter, upstreams: "core.account_months, core.accounts, core.load_status"}
      - {view_name: mrr_summary_monthly, upstreams: "core.account_months, core.load_status"}
    note: A declaration that nobody checks rots. When a view reads a new table, update model.yml and this case together.

  # ===================================================================================
  # plane: db_check  -- freshness at a frozen clock (F-)
  # ===================================================================================
  - id: F00
    plane: db_check
    question: How old is the data at the course clock?
    expected_behavior: answer
    evaluation_clock: "2026-07-01T09:00:00Z"
    truth_source: load 2026-07-01T06:00:00Z; warn after 36 h
    sql: |
      SELECT view_name,
             extract(epoch FROM (TIMESTAMPTZ '2026-07-01 09:00:00+00' - data_loaded_at_utc)) / 3600 AS age_hours,
             CASE WHEN extract(epoch FROM (TIMESTAMPTZ '2026-07-01 09:00:00+00' - data_loaded_at_utc)) / 3600 > warn_after_hours
                  THEN 'stale_disclosed' ELSE 'fresh' END AS freshness_state
      FROM analytics.data_status_by_view
      WHERE view_name = 'analytics.mrr_summary_monthly'
    expected_rows:
      - {view_name: analytics.mrr_summary_monthly, age_hours: 3, freshness_state: fresh}

  - id: F01
    plane: db_check
    template_id: F01
    question: How old is the data at the what-if clock?
    expected_behavior: answer
    evaluation_clock: "2026-07-03T18:00:00Z"
    truth_source: load 2026-07-01T06:00:00Z; warn after 36 h; no hard expiry
    sql: |
      SELECT view_name,
             extract(epoch FROM (TIMESTAMPTZ '2026-07-03 18:00:00+00' - data_loaded_at_utc)) / 3600 AS age_hours,
             CASE WHEN extract(epoch FROM (TIMESTAMPTZ '2026-07-03 18:00:00+00' - data_loaded_at_utc)) / 3600 > warn_after_hours
                  THEN 'stale_disclosed' ELSE 'fresh' END AS freshness_state,
             hard_expiry_hours
      FROM analytics.data_status_by_view
      WHERE view_name = 'analytics.mrr_summary_monthly'
    expected_rows:
      - {view_name: analytics.mrr_summary_monthly, age_hours: 60, freshness_state: stale_disclosed, hard_expiry_hours: null}
    note: 'The answer is still given, with a warning. Deck: "No age-based block rule was written."'

  # ===================================================================================
  # plane: db_check  -- teaching examples for the extra metric shapes (T-)
  # ===================================================================================
  - id: T01
    plane: db_check
    question: How many distinct accounts were active at any month-end in Q2 2026?
    expected_behavior: answer
    metric: active_accounts
    relation: analytics.account_mrr_monthly
    truth_source: seed (120 at end of March; 3 April churners; 24 Q2 joiners)
    sql: |
      SELECT count(DISTINCT account_key) AS distinct_active_accounts,
             count(*) AS active_account_months
      FROM analytics.account_mrr_monthly
      WHERE month_start >= DATE '2026-04-01' AND month_start < DATE '2026-07-01'
        AND ending_mrr_eur > 0
    expected_rows:
      - {distinct_active_accounts: 141, active_account_months: 378}
    note: 378 is what you get by adding the monthly counts 123 + 123 + 132. It counts account-months, not accounts.

  - id: T02
    plane: db_check
    question: What was average MRR per active account at each month-end in Q2 2026?
    expected_behavior: answer
    metric: avg_mrr_per_active_account
    relation: analytics.mrr_summary_monthly
    truth_source: fixed facts (endings) + seed (active counts)
    sql: |
      SELECT month_start, round(ending_mrr_eur / nullif(active_accounts, 0), 2) AS avg_mrr_per_active_account_eur
      FROM analytics.mrr_summary_monthly
      WHERE month_start >= DATE '2026-04-01' AND month_start < DATE '2026-07-01'
      ORDER BY month_start
    expected_rows:
      - {month_start: "2026-04-01", avg_mrr_per_active_account_eur: 2720.93}
      - {month_start: "2026-05-01", avg_mrr_per_active_account_eur: 2800.41}
      - {month_start: "2026-06-01", avg_mrr_per_active_account_eur: 2931.93}

  # ===================================================================================
  # plane: ai_run  -- Claude answers. Graded on value, behaviour, relation and citation.
  # Required trace for every "answer" case below.
  # ===================================================================================
  - id: G01
    plane: ai_run
    template_id: G01
    question: Show ending MRR by month for the last complete quarter.
    expected_behavior: answer
    expected_values_from: {plane: db_check, id: G01}
    required_relation: analytics.mrr_summary_monthly
    required_trace: &answer_trace
      - metric_name                           # e.g. ending_mrr
      - metric_version                        # 1.0.0
      - exact_period                          # 2026-04-01 to 2026-06-30
      - unit                                  # EUR
      - relation                              # schema-qualified
      - data_loaded_at_utc
      - age_hours
      - evaluation_clock
      - freshness_state
      - limitations
    runs_required: 3
    grade: [value, behaviour, relation, metric_citation, freshness_stated]
    known_wrong_patterns:
      - {values: [-19960, 9775, 42565], cause: "monthly changes read as levels (recorded run)"}
      - {values: [75890, 85665, 128230], cause: "running totals from January with no opening balance (dry run, one observation)"}
      - {values: [1066140], cause: "levels summed across months"}

  - id: G02
    plane: ai_run
    question: What was net new MRR in the last complete quarter?
    expected_behavior: answer
    expected_values_from: {plane: db_check, id: G02}
    required_relation: analytics.mrr_summary_monthly
    required_trace: *answer_trace
    runs_required: 3
    grade: [value, behaviour, relation, metric_citation, freshness_stated]
    known_wrong_patterns:
      - {values: [-17595], cause: "June change minus March change"}

  - id: G03
    plane: ai_run
